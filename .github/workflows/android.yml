name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: APK, lint y pruebas de dominio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Also validates gradle-wrapper.jar against official checksums.
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew scripts/test-core.sh
      - name: Pruebas de dominio (JVM)
        run: ./scripts/test-core.sh
      - name: Compilar APK debug, lint y release (sin firmar)
        run: ./gradlew assembleDebug lintDebug assembleRelease --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: tres-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Subir informe de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  beta:
    name: Prueba de navegador (HTML beta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/beta.test.cjs
