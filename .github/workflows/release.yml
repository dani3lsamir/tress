name: Release APK

# Push a tag like v1.0.1 (or create a Release with that tag on GitHub) to publish a signed APK.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar secretos de firma
        env:
          KS: ${{ secrets.TRES_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.TRES_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.TRES_KEY_ALIAS }}
          KP: ${{ secrets.TRES_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Faltan secretos de firma (TRES_KEYSTORE_BASE64, TRES_KEYSTORE_PASSWORD, TRES_KEY_ALIAS, TRES_KEY_PASSWORD) en Settings > Secrets and variables > Actions."; exit 1; fi
          done
      - name: Versión desde el tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          echo "TRES_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "TRES_VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - name: Restaurar keystore
        env:
          KS: ${{ secrets.TRES_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TRES_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: chmod +x gradlew scripts/test-core.sh && ./scripts/test-core.sh
      - name: Compilar y firmar APK release
        env:
          TRES_KEYSTORE_PASSWORD: ${{ secrets.TRES_KEYSTORE_PASSWORD }}
          TRES_KEY_ALIAS: ${{ secrets.TRES_KEY_ALIAS }}
          TRES_KEY_PASSWORD: ${{ secrets.TRES_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Tres-${TRES_VERSION_NAME}.apk"
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Tres-${TRES_VERSION_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Tres-${TRES_VERSION_NAME}.apk" --title "Tres ${TRES_VERSION_NAME}" --generate-notes
          fi
      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
