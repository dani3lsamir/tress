plugins { id 'com.android.application' }

// Release signing comes from CI secrets (see .github/workflows/release.yml). Without them,
// debug builds work as usual and release builds are produced unsigned.
def releaseKeystore = System.getenv('TRES_KEYSTORE_PATH')

android {
    namespace 'app.tres.notes'
    compileSdk 34
    defaultConfig {
        applicationId 'app.tres.notes'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('TRES_VERSION_CODE') ?: '1') as int)
        versionName System.getenv('TRES_VERSION_NAME') ?: '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('TRES_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TRES_KEY_ALIAS')
                keyPassword System.getenv('TRES_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}
